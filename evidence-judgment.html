<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>證據導向判斷｜Classroom Interactive</title><link rel="stylesheet" href="evidence-judgment.css"><link rel="stylesheet" href="student-interface.css"><script src="evidence-judgment-core.js" defer></script><script src="session-api.js" defer></script><script src="evidence-judgment.js" defer></script></head><body><header><h1>證據導向判斷</h1><p id="subtitle">閱讀資料、形成判斷、提出證據，再思考是否修正原有觀點。</p></header><main><div class="stage-list" id="steps"></div><section class="card"><h2 id="question">核心提問</h2><div id="sourceTitle" class="caption"></div><div id="source" class="source"></div><div class="actions" style="margin-top:.8rem"><button type="button" id="copyEvidence">將選取的文字加入證據</button><span class="caption">可直接選取上方文字，或自行輸入摘錄</span></div></section><section id="workspace" class="card"><h2 id="stageTitle"></h2><p class="caption" id="stageHint"></p><div id="choices"></div><label id="quoteLabel" class="hidden" for="quote">支持判斷的證據</label><textarea id="quote" maxlength="2000" class="hidden" placeholder="選取材料句子，或手動輸入證據"></textarea><label id="relationLabel" class="hidden" for="relation">這份證據如何支持你的判斷？</label><textarea id="relation" maxlength="2000" class="hidden" placeholder="解釋證據和判斷之間的關係"></textarea><label id="reasonLabel" for="reason">判斷理由</label><textarea id="reason" maxlength="2000" placeholder="你是依據什麼做出判斷？"></textarea><p id="error" class="error" role="alert"></p><div class="actions"><button type="button" id="back">返回前一階段</button><button type="button" id="next" class="primary">儲存並繼續</button></div></section><section class="card hidden" id="groupPanel" aria-label="小組證據與共同判斷">
  <h2 id="groupTitle">小組證據交流</h2><p class="caption" id="groupMeta"></p>
  <p class="caption" id="groupPrompt"></p><div id="groupChoices"></div>
  <label id="groupOpenLabel" class="hidden" for="groupOpen">小組共同判斷</label><textarea id="groupOpen" class="hidden" maxlength="1000"></textarea>
  <label for="groupReason">小組共同理由</label><textarea id="groupReason" maxlength="2000"></textarea>
  <label for="groupQuote">支持共同判斷的證據</label><textarea id="groupQuote" maxlength="2000"></textarea>
  <label for="groupRelation">證據如何支持小組判斷？</label><textarea id="groupRelation" maxlength="2000"></textarea>
  <label for="groupDiscussion">討論後達成共識的說明（可選）</label><textarea id="groupDiscussion" maxlength="2000"></textarea>
  <p id="groupNotice" class="caption" role="status"></p><div class="actions">
    <button type="button" id="groupSave" class="primary">提交小組共同判斷</button>
    <button type="button" id="groupRestore">重新載入已儲存的小組成果</button>
  </div>
</section><section class="card hidden" id="complete"><h2>已完成本次判斷</h2><p>維持或改變立場都可以；請用證據及理由檢視自己的判斷。</p><div id="comparison" class="readback"></div><div class="actions"><button type="button" id="review">檢視或修改（預覽模式）</button><button type="button" id="reset">清除本機預覽記錄</button></div></section><button type="button" id="personalRestore" class="hidden">重新載入雲端個人答案（捨棄未提交草稿）</button><p id="storageNote" class="caption" role="status">活動預覽暫存於本機；正式課堂請依教師開放階段提交雲端答案。</p></main></body></html>
